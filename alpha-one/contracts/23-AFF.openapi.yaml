openapi: 3.1.0
info:
  title: Alpha One — AFF (Affiliates)
  version: 1.0.0
  description: 'Referrals, commissions, rate cards, reversals, self-referral.


    Module doc: [docs/23-affiliates.md](../docs/23-affiliates.md). V1 baseline: operations with `x-phase:
    V1` are the V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/n/a); `x-phase: extended`
    operations are the post-V1 design surface (provisional URL plan). Error codes: [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md)
    (AFF namespace; the V1 set in contracts/errors/taxonomy.md). Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md).
    Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
servers:
- url: https://api.staging.alphaone.example
  description: Staging (synthetic data only)
tags:
- name: core
  description: Core domain endpoints (trader + shared)
- name: console
  description: Platform console (CON) surface
