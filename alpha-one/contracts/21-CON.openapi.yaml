      tags:
      - console
      summary: Platform Console POST /v1/console/auth/login
      operationId: post_v1_console_auth_login
      x-phase: V1
      x-v1-baseline: contracts/api/con.md
      x-idempotency: optional
      x-auth: none (public console login) — CON-01
      x-v1-errors:
      - auth.invalid_credentials
      - auth.totp_required
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: shared/openapi.yaml#/components/schemas/JsonObject
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
