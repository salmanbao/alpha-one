openapi: 3.1.0
info:
  title: Alpha One — CON (Platform Console)
  version: 1.0.0
  description: 'Platform (super-admin) console: tenants, audit review, incidents.


    Module doc: [docs/21-console.md](../docs/21-console.md). V1 baseline: operations with `x-phase: V1`
    are the V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/con.md); `x-phase: extended`
    operations are the post-V1 design surface (provisional URL plan). Error codes: [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md)
    (CON namespace; the V1 set in contracts/errors/taxonomy.md). Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md).
    Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
servers:
- url: https://api.staging.alphaone.example
  description: Staging (synthetic data only)
tags:
- name: console
  description: Platform console (CON) surface
paths:
  /v1/console/auth/login:
