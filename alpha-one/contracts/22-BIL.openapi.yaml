openapi: 3.1.0
info:
  title: Alpha One — BIL (Tenant Billing)
  version: 1.0.0
  description: 'Usage metering, invoicing, pass-through, dunning.


    Module doc: [docs/22-billing.md](../docs/22-billing.md). V1 baseline: operations with `x-phase: V1`
    are the V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/n/a); `x-phase: extended`
    operations are the post-V1 design surface (provisional URL plan). Error codes: [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md)
    (BIL namespace; the V1 set in contracts/errors/taxonomy.md). Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md).
    Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
servers:
- url: https://api.staging.alphaone.example
  description: Staging (synthetic data only)
tags:
- name: console
  description: Platform console (CON) surface
- name: core
  description: Core domain endpoints (trader + shared)
