      x-idempotency: required
      x-auth: ZITADEL access token (bearer, tenant audience) — AUTH-04/07
      x-v1-errors:
      - auth.token_invalid
      - auth.account_suspended
      - auth.tenant_suspended
      - auth.mfa_required
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: shared/openapi.yaml#/components/schemas/JsonObject
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
