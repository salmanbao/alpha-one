      - core
      summary: Identity & Access POST /v1/auth/register
      operationId: post_v1_auth_register
      x-phase: V1
      x-v1-baseline: contracts/api/auth.md
      x-idempotency: required
      x-auth: none (public; Trader role afterwards) — AUTH-01
      x-v1-errors:
      - auth.invalid_registration
      - auth.email_taken
      - tenant.suspended
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: shared/openapi.yaml#/components/schemas/JsonObject
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
