      x-v1-baseline: contracts/api/chk.md
      x-idempotency: n/a
      x-auth: none required (public browsing) — TODO — needs owner decision; story TD-09 implies pre-login
        browsing
      x-v1-errors:
      - catalog.challenge_not_found
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
