openapi: 3.1.0
info:
  title: Alpha One — OPS (DevOps & Deployment)
  version: 1.0.0
  description: 'Infra, CI/CD, environments, observability, DR, health endpoints.


    Module doc: [docs/06-devops-deployment.md](../docs/06-devops-deployment.md). V1 baseline: operations
    with `x-phase: V1` are the V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/ops.md);
    `x-phase: extended` operations are the post-V1 design surface (provisional URL plan). Error codes:
    [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md) (OPS namespace; the V1 set in contracts/errors/taxonomy.md).
    Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md). Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
servers:
- url: https://api.staging.alphaone.example
  description: Staging (synthetic data only)
tags:
- name: console
  description: Platform console (CON) surface
paths:
  /v1/console/ops/health:
    get:
      tags:
      - console
      summary: (per-service + PG/Redis/relay/disk)
      operationId: get_v1_console_ops_health
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/console/ops/backups:
    get:
      tags:
      - console
      summary: (history + last drill report)
      operationId: get_v1_console_ops_backups
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/console/ops/backups/verify:
    post:
      tags:
      - console
      summary: (manual checksum)
      operationId: post_v1_console_ops_backups_verify
      x-phase: extended
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: shared/openapi.yaml#/components/schemas/JsonObject
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/console/ops/costs:
    get:
      tags:
      - console
      summary: '(V2 OPS-23: Hetzner + provider usage from BRG-47'
      operationId: get_v1_console_ops_costs
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/console/ops/slos:
    get:
      tags:
      - console
      summary: (V2 OPS-40)
      operationId: get_v1_console_ops_slos
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
components:
  schemas:
    JsonObject:
      description: Module-specific object. The canonical shape is defined in the module doc's §8 (Schema);
        this generic reference is a contract-pack placeholder until the module's schema is inlined.
      type: object
      additionalProperties: true
  securitySchemes:
    sessionAuth:
      $ref: shared/openapi.yaml#/components/securitySchemes/sessionAuth
    apiKeyAuth:
      $ref: shared/openapi.yaml#/components/securitySchemes/apiKeyAuth
    internalService:
      $ref: shared/openapi.yaml#/components/securitySchemes/internalService
    webhookSignature:
      $ref: shared/openapi.yaml#/components/securitySchemes/webhookSignature
