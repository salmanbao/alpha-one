openapi: 3.1.0
info:
  title: Alpha One — DOC (Document Generation)
  version: 1.0.0
  description: 'Certificates, statements, PDFs (Puppeteer), storage, mappers.


    Module doc: [docs/15-documents.md](../docs/15-documents.md). V1 baseline: operations with `x-phase:
    V1` are the V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/doc.md); `x-phase:
    extended` operations are the post-V1 design surface (provisional URL plan). Error codes: [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md)
    (DOC namespace; the V1 set in contracts/errors/taxonomy.md). Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md).
    Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
servers:
- url: https://api.staging.alphaone.example
  description: Staging (synthetic data only)
tags:
- name: admin
  description: Tenant admin (ADM) surface
- name: core
  description: Core domain endpoints (trader + shared)
paths:
  /v1/trader/documents:
    get:
      tags:
      - core
      summary: Document Generation GET /v1/trader/documents
      operationId: get_v1_trader_documents
      x-phase: V1
      x-v1-baseline: contracts/api/doc.md
      x-idempotency: n/a
      x-auth: Trader (self) — DOC-06
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
