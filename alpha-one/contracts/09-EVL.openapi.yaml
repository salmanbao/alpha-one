  description: 'Rule packs, verdicts, drawdowns, day boundaries (Rust service).


    Module doc: [docs/09-evaluation-engine.md](../docs/09-evaluation-engine.md). V1 baseline: operations
    with `x-phase: V1` are the V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/evl.md);
    `x-phase: extended` operations are the post-V1 design surface (provisional URL plan). Error codes:
    [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md) (EVL namespace; the V1 set in contracts/errors/taxonomy.md).
    Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md). Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
