openapi: 3.1.0
info:
  title: Alpha One — MIG (Migration)
  version: 1.0.0
  description: 'TTS to Alpha One cutover and data migration pipeline.


    Module doc: [docs/25-migration.md](../docs/25-migration.md). V1 baseline: operations with `x-phase:
    V1` are the V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/n/a); `x-phase: extended`
    operations are the post-V1 design surface (provisional URL plan). Error codes: [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md)
    (MIG namespace; the V1 set in contracts/errors/taxonomy.md). Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md).
    Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
