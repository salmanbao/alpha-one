  /v1/td/health:
    get:
      tags:
      - core
      summary: (for the UI's
      operationId: get_v1_td_health
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
