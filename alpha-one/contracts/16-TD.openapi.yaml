        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/payouts:
    get:
      tags:
      - core
      summary: '| eligibility re-fetched on open (server-side) — never trust the cached preview |'
      operationId: get_v1_payouts
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/documents:
    get:
      tags:
      - core
      summary: + signed URLs (15 §7) | |
      operationId: get_v1_documents
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
