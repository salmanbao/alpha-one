        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/trader/kyc/status:
    get:
      tags:
      - core
      summary: KYC Verification GET /v1/trader/kyc/status
      operationId: get_v1_trader_kyc_status
      x-phase: V1
      x-v1-baseline: contracts/api/kyc.md
      x-permission: self
      x-idempotency: n/a
      x-auth: Trader (self) — implied by KYC-06 "status is explicit and queryable"
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
