      tags:
      - webhook
      summary: KYC Verification POST /v1/webhooks/kyc/{provider}
      operationId: post_v1_webhooks_kyc_provider
      x-phase: V1
      x-v1-baseline: contracts/api/kyc.md
      x-permission: none
      x-idempotency: required — dedupe by provider event id
      x-auth: provider signature (EVT-10 shared verification utilities) — KYC-05
      x-v1-errors:
      - webhook.signature_invalid
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: shared/openapi.yaml#/components/schemas/JsonObject
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
