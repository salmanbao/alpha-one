openapi: 3.1.0
info:
  title: Alpha One — KYC (KYC Verification)
  version: 1.0.0
  description: 'L1/L2 verification, provider adapters, document handling, reverify.


    Module doc: [docs/13-kyc.md](../docs/13-kyc.md). V1 baseline: operations with `x-phase: V1` are the
    V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/kyc.md); `x-phase: extended` operations
    are the post-V1 design surface (provisional URL plan). Error codes: [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md)
    (KYC namespace; the V1 set in contracts/errors/taxonomy.md). Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md).
    Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
servers:
- url: https://api.staging.alphaone.example
  description: Staging (synthetic data only)
tags:
- name: core
  description: Core domain endpoints (trader + shared)
- name: admin
  description: Tenant admin (ADM) surface
- name: webhook
  description: Inbound provider webhook (signature-verified)
paths:
  /v1/trader/kyc/sessions:
    post:
      tags:
      - core
      summary: KYC Verification POST /v1/trader/kyc/sessions
      operationId: post_v1_trader_kyc_sessions
      x-phase: V1
      x-v1-baseline: contracts/api/kyc.md
      x-permission: self
      x-idempotency: required
      x-auth: Trader — implied by KYC-01 session creation + TD-02 self-serve flow
      x-v1-errors:
      - kyc.country_restricted
      - kyc.already_in_progress
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: shared/openapi.yaml#/components/schemas/JsonObject
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/webhooks/kyc/{provider}:
