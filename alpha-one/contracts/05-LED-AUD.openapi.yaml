      x-v1-baseline: contracts/api/led.md + contracts/api/aud.md
      x-permission: audit.read
      x-idempotency: n/a
      x-auth: staff with audit read permission — AUD-21
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
