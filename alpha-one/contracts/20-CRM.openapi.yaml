openapi: 3.1.0
info:
  title: Alpha One — CRM (CRM & Communications)
  version: 1.0.0
  description: 'Segments, campaigns, sequences, consent, RSK-exclusion.


    Module doc: [docs/20-crm.md](../docs/20-crm.md). V1 baseline: operations with `x-phase: V1` are the
    V1 execution-sheet contract (see the doc''s §7.1 and contracts/api/n/a); `x-phase: extended` operations
    are the post-V1 design surface (provisional URL plan). Error codes: [docs/30-error-taxonomy.md](../docs/30-error-taxonomy.md)
    (CRM namespace; the V1 set in contracts/errors/taxonomy.md). Events: [docs/31-event-catalog.md](../docs/31-event-catalog.md).
    Schema: [docs/32-database-design.md](../docs/32-database-design.md).'
servers:
- url: https://api.staging.alphaone.example
  description: Staging (synthetic data only)
tags:
- name: core
  description: Core domain endpoints (trader + shared)
- name: public
  description: Public API (key-authed, the SDK/DVP surface)
paths:
  /v1/crm/segments:
    get:
      tags:
      - core
      summary: (+ POST, POST /{id}/recompute)
      operationId: get_v1_crm_segments
      x-phase: extended
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
          content:
            application/json:
              schema:
                $ref: shared/openapi.yaml#/components/schemas/JsonObject
        default:
          $ref: shared/openapi.yaml#/components/responses/Error
        '401':
          $ref: shared/openapi.yaml#/components/responses/Unauthorized
        '403':
          $ref: shared/openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: shared/openapi.yaml#/components/responses/NotFound
  /v1/crm/segments/{id}/preview:
    get:
      tags:
      - core
      summary: (size + masked top 50)
      operationId: get_v1_crm_segments_id_preview
      x-phase: extended
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      responses:
        '200':
          description: Success (see module doc for the canonical shape)
