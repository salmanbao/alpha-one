  /v1/risk/cases/{id}/signals:
    get:
      tags:
      - core
      summary: Risk Management GET /v1/risk/cases/{id}/signals
      operationId: get_v1_risk_cases_id_signals
      x-phase: extended
      parameters:
      - name: id
