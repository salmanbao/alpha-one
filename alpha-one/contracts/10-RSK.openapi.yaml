    get:
      tags:
      - core
      summary: Risk Management GET /v1/risk/cases/{id}
      operationId: get_v1_risk_cases_id
      x-phase: extended
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionAuth: []
      responses:
        '200':
