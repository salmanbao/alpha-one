[package]
name = "replay-tool"
version = "0.1.0"
edition = "2021"
description = "CLI: replay a JSONL canonical event stream through the rules engine (doc §6.7, §7.2)."

[[bin]]
name = "replay-tool"
path = "src/main.rs"

[dependencies]
rules-engine = { path = "../rules-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"
